plugins {
    id 'fml-loom' version '0.1'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '8.3.6'
}

version = project.mod_version
group = project.maven_group

def useLocalizedArchiveName = Locale.default.country.equalsIgnoreCase("CN")

base {
    // Prefix local JAR names with an optional alias, for example: "[Alias]" + archives_base_name.
    // Maven publishing keeps using the lowercase maven_id configured below.
    archivesName = useLocalizedArchiveName
            ? "[网络音乐机]${project.archives_base_name}"
            : project.archives_base_name
    }

    repositories {
        // Publication repositories are separate from dependency repositories declared above.
        // Add or remove release targets here without changing dependency resolution.
    // Add repositories to retrieve artifacts from in here.
    // Only declare repositories required by this project because Loom provides
    // the repositories needed for Minecraft and its libraries automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repository declarations.
    mavenCentral()
    maven {
        name = "ModdedMITE"
        url = uri("https://maven.limingzxc.top/repository/maven-public/")
    }
}

configurations {
    fml
    shade
    implementation.extendsFrom(shade)
}

dependencies {
    // Dependency versions are maintained in gradle.properties or alongside project-specific declarations below.
    // Use implementation for required mods, compileOnly for optional integrations,
    // and localRuntime for mods needed only in the development environment.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    fml "com.github.MinecraftIsTooEasy:FishModLoader:3.4.2"
    implementation "com.github.MinecraftIsTooEasy:FishModLoader:3.4.2"

    implementation "com.github.MinecraftIsTooEasy:ManyLib:2.3.1"
    implementation "com.github.MinecraftIsTooEasy:ModMenu:10.1.1"
    implementation "com.github.MinecraftIsTooEasy:RustedIronCore:1.5.4"
    implementation "com.github.MinecraftIsTooEasy:RustedIronCore:1.5.4:sources"
//    implementation files("../RustedIronCore/build/libs/RustedIronCore-1.5.4.jar")

    implementation "com.github.MinecraftIsTooEasy:Gson:2.10.1"
    implementation "com.github.MinecraftIsTooEasy:FastUtil:8.5.12"
    implementation "com.github.MinecraftIsTooEasy:EMI:1.1.26"

    localRuntime "com.github.MinecraftIsTooEasy:ModernMITE:3.7.5"

    shade files("libs/jflac-codec-1.5.3-SNAPSHOT.jar")
    shade files("libs/jlayer-1.0.1.4.jar")
    shade files("libs/mp3spi-1.9.5.4.jar")
    shade files("libs/tritonus-share-0.3.7.4.jar")
    shade files("libs/javasound-aac-0.9.6.jar")
    shade files("libs/commons-codec-1.15.jar")
    shade files("libs/commons-lang3-3.12.0.jar")
}

def fmlResolvedFile = configurations.fml.singleFile

loom {
    accessWidenerPath = file("src/main/resources/netmusic.accesswidener")
    mergedMinecraftJar()
    setFML(fmlResolvedFile)
    dependencies.add("mappings", fmlMCPMappings())

    mods {
        "netmusic" {
            sourceSet sourceSets.main
//            sourceSet sourceSets.client
//            sourceSet sourceSets.server
//            For modules in the 'src' directory, only the main source set is required by default.
        }
    }
    runs {
        client {
            String name = project.username
            String width = project.screen_width
            String height = project.screen_height
            programArgs "--userProperties", "{}", "--username", name, "--session", "a.a.a.a", "--width", width, "--height", height
        }
//        server {
//            programArgs "--", ""
//        }
    }
}

processResources {
    inputs.properties(
            version: project.version,
            id: project.mod_id,
            name: project.mod_name
    )

    filesMatching("fml.mod.json") {
        expand(inputs.properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

java {
    // Loom automatically attaches sourcesJar to remapSourcesJar and the build lifecycle when it is present.
    // Remove this line only when source artifacts should not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

sourceSets {
    main {
        java {
            // Compile all compatibility modules, including TLM.
        }
    }
}

jar {
    archiveClassifier.set("dev")
}

shadowJar {
    inputs.property "archivesName", project.base.archivesName
    archiveClassifier.set("")
    configurations = [project.configurations.shade]
    mergeServiceFiles()

    from("LICENSE") {
        rename { String fileName -> "${fileName}_${inputs.properties.archivesName}" }
    }

    // Prevent loading old commons classes from the game/modpack classpath.
    relocate "org.apache.commons.lang3", "com.github.tartaricacid.netmusic.shadow.org.apache.commons.lang3"
    relocate "org.apache.commons.codec", "com.github.tartaricacid.netmusic.shadow.org.apache.commons.codec"
}

assemble.dependsOn tasks.shadowJar

// Configure the Maven publication.
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            groupId = project.maven_group
            artifactId = project.maven_id
            version = project.mod_version
            from(components.java)
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
repositories {
    maven {
        name = "Spongepowered"
        url = "https://repo.spongepowered.org/repository/maven-public/"
    }
    maven {
            name = "ModdedMITE"
            url = uri("https://maven.limingzxc.top/repository/maven-releases/")
            credentials {
                // Read only from gradle.properties (user level, your gradle_home)
                username = project.findProperty("nexusUsername")
                password = project.findProperty("nexusPassword")
            }
        }
    }
}
